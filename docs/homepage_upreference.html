body{margin:0;background:#FAFAF7;overflow-x:hidden}

.dots{background-image:radial-gradient(#a4d9ca 1.2px,transparent 1.2px);background-size:26px 26px}
.adv{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.adv.open{grid-template-rows:1fr}
.adv>div{min-height:0;overflow:hidden}
.adv.ov>div{overflow:visible}
:focus-visible{outline:3px solid #00A88D;outline-offset:2px}

.explorer-pop:hover{background:#213F33}
.explorer-card-accent{border-top:4px solid #00A88D}

.account-menu{position:fixed;left:24px;bottom:88px;z-index:61;width:min(320px,calc(100vw - 48px));border:1px solid #D0DDD9;border-radius:10px;background:white;box-shadow:0 14px 45px #1c423436;padding:12px}
.account-backdrop{position:fixed;inset:0;z-index:55;background:#092C2933}
.account-modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:65;width:min(440px,calc(100vw - 28px));max-height:90vh;overflow:auto;background:white;padding:24px;border-radius:12px;box-shadow:0 18px 60px #102d2b66}
.account-menu button:not(.plain){display:block;width:100%;padding:11px 12px;text-align:left;border-radius:7px;font-size:14px;font-weight:600}
.account-menu button:not(.plain):hover{background:#E7FFF2}
.account-modal input:not([type=checkbox]){width:100%;border:1px solid #D0DDD9;border-radius:7px;padding:11px;margin-top:5px;margin-bottom:12px}

</style>

 useEffect(()=>{const c=e=>{if(r.current&&!r.current.contains(e.target))set(false)},k=e=>e.key==="Escape"&&set(false);
  document.addEventListener("mousedown",c);document.addEventListener("keydown",k);return()=>{document.removeEventListener("mousedown",c);document.removeEventListener("keydown",k)}},[]);return[o,set,r]}
const arrowNav=e=>{const b=[...e.currentTarget.querySelectorAll('[role=option]')],i=b.indexOf(document.activeElement);
 if(e.key==="ArrowDown"){e.preventDefault();b[(i+1)%b.length]?.focus()}if(e.key==="ArrowUp"){e.preventDefault();b[(i<=0?b.length:i)-1]?.focus()}};
const Menu=({children,cls=""})=>h`<div role="listbox" onKeyDown=${arrowNav} className=${"absolute left-0 right-0 top-[calc(100%+6px)] z-40 rounded-2xl border border-line bg-white p-1.5 shadow-[0_10px_30px_rgba(6,75,64,.12)] "+cls}>${children}</div>`;
const Opt=({sel,children,...p})=>h`<button type="button" role="option" aria-selected=${!!sel} className=${"block w-full rounded-xl px-3.5 py-2.5 text-left text-[15px] font-semibold hover:bg-mint focus:bg-mint "+(sel?"text-teal":"text-ink")} ...${p}>${children}</button>`;

/* ---------- ExplorerLogo / Header ---------- */
const ExplorerLogo=()=>h`<div><img src=${LOGO} alt="Explorer" className="h-9 w-auto sm:h-11"/><p className="mt-1 text-[15px] font-bold text-forest sm:text-base">Find your next trip</p></div>`;
const Header=({view,go})=>{const nl="flex items-center rounded-full px-1 py-2.5 text-[15px] font-semibold leading-none hover:text-teal ";
 return h`<header className="flex flex-wrap items-center justify-between gap-x-6 gap-y-3 py-5">
 <button onClick=${()=>go("search")} aria-label="Explorer home" className="text-left"><${ExplorerLogo}/></button>
 <nav aria-label="Main" className="flex flex-wrap items-center gap-x-6 gap-y-2 sm:gap-x-8">
  <button className=${nl+(view==="search"||view==="results"?"text-teal":"")} onClick=${()=>go("search")}>Explore</button>
  <button className=${nl+(view==="about"?"text-teal":"")} onClick=${()=>go("about")}>About us</button>
  <div className="relative flex items-center justify-center"><span aria-disabled="true" className="flex cursor-default items-center px-1 py-2.5 text-[15px] font-semibold leading-none text-ink/80">Community</span><span className="absolute left-1/2 top-full -translate-x-1/2 whitespace-nowrap text-[11px] leading-none text-mute">Work in progress</span></div>
  <button onClick=${()=>go("trips")} className=${"flex items-center rounded-full bg-mint px-5 py-2.5 text-[15px] font-semibold leading-none hover:bg-soft "+(view==="trips"?"ring-2 ring-teal/40":"")}>My trips</button>
 </nav></header>`};

/* ---------- field shells ---------- */
const FieldCard=({icon,label,helper,children,chev,err})=>h`<div className=${CARD+" relative flex min-h-[84px] items-center gap-3.5 px-4 py-3 transition-colors focus-within:border-teal/60 "+(err?"!border-red-400":"")}>
 <span className="grid h-10 w-10 shrink-0 place-items-center rounded-full bg-mint"><${Icon} n=${icon}/></span>
 <div className="min-w-0 flex-1"><div className=${LBL}>${label}</div>${children}${helper&&h`<div className="text-xs text-mute">${helper}</div>`}</div>${chev&&h`<${Icon} n="chev" c="h-4 w-4 stroke-ink"/>`}</div>`;

const CityInput=({value,onChange,multi,chips=[],onChips,placeholder,label,other=[]})=>{
 const[q,setQ]=useState(multi?"":value),[o,setO,r]=useOpen(),[act,setAct]=useState(-1);
 useEffect(()=>{if(!multi)setQ(value)},[value]);
 const sug=CITIES.filter(c=>c.toLowerCase().includes(q.trim().toLowerCase())&&!chips.includes(c)&&!other.includes(c)&&c!==(multi?"":value)).slice(0,6);
 const pick=c=>{if(multi){onChips([...chips,c]);setQ("")}else{onChange(c);setQ(c)}setO(false);setAct(-1)};
 const key=e=>{if(e.key==="ArrowDown"){e.preventDefault();setO(true);setAct(a=>Math.min(a+1,sug.length-1))}
  else if(e.key==="ArrowUp"){e.preventDefault();setAct(a=>Math.max(a-1,0))}
  else if(e.key==="Enter"){if(multi||o){e.preventDefault();const c=sug[act]||(q.trim()&&(CITIES.find(x=>x.toLowerCase()===q.trim().toLowerCase())||q.trim()));if(c)pick(c)}}
  else if(e.key==="Backspace"&&multi&&!q&&chips.length)onChips(chips.slice(0,-1))};
 const inp=h`<input aria-label=${label} aria-autocomplete="list" autoComplete="off" value=${q} placeholder=${placeholder}
  onChange=${e=>{setQ(e.target.value);setO(true);setAct(-1);if(!multi)onChange(e.target.value)}} onFocus=${()=>setO(true)} onKeyDown=${key}
  className=${multi?"min-w-[8ch] flex-1 bg-transparent py-1 text-[15px] font-medium outline-none placeholder:text-mute/70":"w-full bg-transparent text-xl font-bold outline-none"}/>`;
 const list=o&&sug.length>0&&h`<${Menu}>${sug.map((c,i)=>h`<${Opt} key=${c} sel=${i===act} onMouseDown=${e=>{e.preventDefault();pick(c)}}>${c}<//>`)}<//>`;
 return multi?h`<div ref=${r} className="relative"><div className="flex min-h-[48px] flex-wrap items-center gap-2 rounded-xl border border-line bg-white px-3 py-1.5 focus-within:border-teal/60">
  ${chips.map(c=>h`<span key=${c} className="inline-flex items-center gap-1 rounded-full bg-mint py-1 pl-3 pr-1.5 text-sm font-semibold">${c}<button type="button" aria-label=${"Remove "+c} onClick=${()=>onChips(chips.filter(x=>x!==c))} className="grid h-5 w-5 place-items-center rounded-full hover:bg-white"><${Icon} n="x" c="h-3 w-3 stroke-ink"/></button></span>`)}${inp}</div>${list}</div>`
  :h`<div ref=${r} className="relative">${inp}${list}</div>`;
};

const Select=({icon,label,value,options,onChange,compact})=>{const[o,setO,r]=useOpen();
 const btn=h`<button type="button" aria-haspopup="listbox" aria-expanded=${o} aria-label=${label+": "+value} onClick=${()=>setO(!o)} className="flex w-full items-center justify-between text-left"><span className=${compact?"text-[15px] font-semibold":"text-xl font-bold"}>${value}</span><${Icon} n="chev" c=${"h-4 w-4 stroke-ink transition-transform "+(o?"rotate-180":"")}/></button>`;
 const menu=o&&h`<${Menu}>${options.map(x=>h`<${Opt} key=${x} sel=${x===value} onClick=${()=>{onChange(x);setO(false)}}>${x}<//>`)}<//>`;
 return compact?h`<div ref=${r} className="relative"><div className="mb-1.5 text-sm font-semibold">${label}</div><div className=${CARD+" !rounded-xl px-4 py-3 focus-within:border-teal/60"}>${btn}</div>${menu}</div>`
 :h`<div ref=${r} className="relative"><${FieldCard} icon=${icon} label=${label}>${btn}<//>${menu}</div>`};

/* ---------- main fields ---------- */
const LocationInput=({s,set,err})=>h`<${FieldCard} icon="pin" label="Round trip from" helper="Leave and return to the same place." err=${err}><${CityInput} label="Round trip from" value=${s.from} onChange=${v=>set({from:v})} placeholder="City"/><//>`;
const DatePicker=({s,set,min,err})=>{const ref=useRef();

const TripDurationSelector=({s,set})=>{const[cus,setCus]=useState(s.len==="custom");
 if(s.ret)return h`<${FieldCard} icon="clock" label="Trip length"><div className="text-xl font-bold">${diff(s.ret,s.date)} days</div><button type="button" onClick=${()=>{setCus(false);set({ret:"",len:s.len==="custom"?"5–8 days":s.len})}} className="text-xs font-semibold text-teal">Set by return date · use a range</button><//>`;
 if(cus)return h`<${FieldCard} icon="clock" label="Trip length"><div className="flex items-center gap-2"><input type="number" min="1" max="60" aria-label="Custom days" autoFocus value=${s.custom} onChange=${e=>set({custom:e.target.value.replace(/\D/g,"")})} className="w-14 bg-transparent text-xl font-bold outline-none"/><span className="font-bold">days</span><button type="button" onClick=${()=>{setCus(false);set({len:"5–8 days"})}} className="ml-auto text-xs font-semibold text-teal">Use range</button></div><//>`;
 return h`<${Select} icon="clock" label="Trip length" value=${s.len} options=${[...LENGTHS,"Custom…"]} onChange=${v=>v==="Custom…"?(setCus(true),set({len:"custom",custom:"6"})):set({len:v})}/>`};
const TravellerSelector=({s,set})=>{const[o,setO,r]=useOpen(),n=s.trav,b="grid h-9 w-9 place-items-center rounded-full border border-line hover:bg-mint disabled:opacity-40";
 return h`<div ref=${r} className="relative"><${FieldCard} icon="users" label="Travellers"><button type="button" aria-haspopup="dialog" aria-expanded=${o} onClick=${()=>setO(!o)} className="flex w-full items-center justify-between text-left"><span className="text-xl font-bold">${n} ${n===1?"person":"people"}</span><${Icon} n="chev" c=${"h-4 w-4 stroke-ink transition-transform "+(o?"rotate-180":"")}/></button><//>
 ${o&&h`<div role="dialog" aria-label="Number of travellers" className="absolute left-0 right-0 top-[calc(100%+6px)] z-40 flex items-center justify-between rounded-2xl border border-line bg-white p-3 shadow-[0_10px_30px_rgba(6,75,64,.12)]"><span className="text-sm font-semibold">Travellers</span><div className="flex items-center gap-3"><button type="button" className=${b} aria-label="Fewer travellers" disabled=${n<=1} onClick=${()=>set({trav:n-1})}><${Icon} n="minus" c="h-4 w-4 stroke-ink"/></button><span aria-live="polite" className="w-5 text-center font-bold">${n}</span><button type="button" className=${b} aria-label="More travellers" disabled=${n>=12} onClick=${()=>set({trav:n+1})}><${Icon} n="plus" c="h-4 w-4 stroke-ink"/></button></div></div>`}</div>`};

/* ---------- budget ---------- */
const BudgetSelector=({s,set,err})=>{const[o,setO,r]=useOpen(),[hl,setHl]=useState(-1);
 const type=v=>set({budget:v.replace(/\D/g,"").replace(/^0+/,"").slice(0,7)}), pick=n=>{set({budget:String(n)});setO(false)};
 const key=e=>{if([".",",","-","+","e"].includes(e.key))e.preventDefault();
  if(e.key==="ArrowDown"){e.preventDefault();setO(true);setHl(i=>(i+1)%SUG.length)}if(e.key==="ArrowUp"){e.preventDefault();setHl(i=>(i<=0?SUG.length:i)-1)}
  if(e.key==="Enter"&&o&&hl>=0){e.preventDefault();pick(SUG[hl])}};
 const seg=(v,t,sub)=>{const on=s.scope===v;return h`<button type="button" role="radio" aria-checked=${on} onClick=${()=>set({scope:v})} className=${"flex min-h-[56px] flex-1 items-center justify-between gap-2 rounded-xl border px-4 text-left font-semibold transition-colors "+(on?"border-teal/70 bg-sel":"border-transparent bg-[#EEF1F1] hover:border-line")}><span>${t}</span>${on&&h`<${Tick}/>`}</button>`};
 return h`<section aria-labelledby="bh" className=${CARD+" p-5 sm:p-6"}>
 <h2 id="bh" className="text-[15px] font-extrabold uppercase tracking-wide text-teal">Your budget</h2>
 <div role="radiogroup" aria-label="Budget covers" className="mt-4 flex flex-col gap-2.5 sm:flex-row">${seg("transport","Transport only")}${seg("whole","Whole trip")}</div>
 <p className="mt-3 text-[13px] text-gray-500">${s.scope==="transport"?"Your budget covers transportation costs only.":"Work in progress"}</p>
 <div className="mt-5"><label htmlFor="bud" className="mb-2 block text-sm font-semibold">Maximum budget</label>
 <div ref=${r} className="relative max-w-[380px]"><div className=${"flex h-[60px] items-center gap-3 rounded-2xl border bg-white px-5 focus-within:ring-4 focus-within:ring-mint "+(err?"border-red-400":"border-teal/60")}>
  <span className="text-lg font-bold">€</span>
  <input id="bud" role="combobox" aria-expanded=${o} aria-controls="bl" inputMode="numeric" autoComplete="off" value=${s.budget} placeholder="Amount" onChange=${e=>{type(e.target.value);setHl(-1)}} onFocus=${()=>setO(true)} onKeyDown=${key} onPaste=${e=>{e.preventDefault();type(e.clipboardData.getData("text"))}} className="min-w-0 flex-1 bg-transparent text-[22px] font-bold outline-none"/>
  <button type="button" tabIndex="-1" aria-label="Show suggested amounts" onClick=${()=>setO(!o)} className="p-1"><${Icon} n="chev" c=${"h-[18px] w-[18px] stroke-ink transition-transform "+(o?"rotate-180":"")}/></button></div>
  ${o&&h`<div id="bl" role="listbox" className="absolute left-1 right-3 top-[calc(100%+4px)] z-40 rounded-2xl border border-line bg-white p-2 shadow-[0_10px_30px_rgba(6,75,64,.12)]">${SUG.map((n,i)=>h`<button type="button" role="option" key=${n} aria-selected=${String(n)===s.budget} onMouseDown=${e=>e.preventDefault()} onClick=${()=>pick(n)} className=${"block w-full rounded-xl px-8 py-2.5 text-left text-lg font-semibold hover:bg-mint "+(i===hl?"bg-mint ":"")+(String(n)===s.budget?"text-teal":"")}>${eur(n)}</button>`)}</div>`}
 </div>${err&&h`<p role="alert" className="mt-1.5 text-[13px] text-red-700">Enter a whole number above 0.</p>`}</div></section>`};

const TransportSelector=({s,set,err})=>h`<section aria-labelledby="th" className=${CARD+" p-5 sm:p-6"}>
 <h2 id="th" className="text-[15px] font-extrabold uppercase tracking-wide text-teal">How would you like to travel?</h2>
 <p className="mt-1.5 text-sm text-mute">Choose one or more transport options.</p>
 <div role="group" aria-label="Transport" className="mt-4 grid grid-cols-3 gap-2.5 sm:gap-3">${MODES.map(([k,t,ic])=>{const on=s.modes.includes(k);
  return h`<button key=${k} type="button" role="checkbox" aria-checked=${on} onClick=${()=>set({modes:on?s.modes.filter(m=>m!==k):[...s.modes,k]})} className=${"relative flex min-h-[112px] flex-col items-center justify-center gap-2.5 rounded-2xl border font-bold transition-colors "+(on?"border-teal/70 bg-sel":"border-line bg-white hover:border-teal/40")}>${on&&h`<span className="absolute right-2 top-2"><${Tick} s="h-[22px] w-[22px]"/></span>`}<${Icon} n=${ic} c="h-8 w-8 stroke-forest"/>${t}</button>`})}</div>
 ${err&&h`<p role="alert" className="mt-2 text-[13px] text-red-700">Choose at least one way to travel.</p>`}</section>`;

const ReturnDate=({s,set})=>h`<div><div className="mb-1.5 text-sm font-semibold">Return date <span className="font-medium text-mute">(optional)</span></div>
 <div className=${CARD+" relative !rounded-xl px-4 py-3 focus-within:border-teal/60"}><div className="flex items-center gap-3"><${Icon} n="cal" c="h-[18px] w-[18px] stroke-ink"/><span className=${"flex-1 text-[15px] "+(s.ret?"font-semibold":"font-medium text-mute/70")}>${s.ret?fmtD(s.ret):"Select a date"}</span></div>
 <input type="date" aria-label="Return date (optional)" min=${s.date?addDays(s.date,1):""} value=${s.ret} onChange=${e=>set({ret:e.target.value})} onClick=${e=>e.target.showPicker&&e.target.showPicker()} className="absolute inset-0 h-full w-full cursor-pointer rounded-xl opacity-0"/>

/* ---------- advanced ---------- */
const AdvancedSearch=({s,set})=>{const[open,setOpen]=useState(false),[ov,setOv]=useState(false),[tip,setTip]=useState(false);
 useEffect(()=>{setOv(false);if(open){const t=setTimeout(()=>setOv(true),320);return()=>clearTimeout(t)}},[open]);
 return h`<section className=${CARD}>
 <button type="button" aria-expanded=${open} aria-controls="adv" onClick=${()=>setOpen(!open)} className="flex w-full items-center gap-3 rounded-[20px] px-5 py-4 text-left sm:px-6"><${Icon} n="sliders"/><span className="flex-1 text-[17px] font-bold">Advanced search</span><${Icon} n="chev" c=${"h-5 w-5 stroke-ink transition-transform duration-300 "+(open?"rotate-180":"")}/></button>
 <div id="adv" className=${"adv "+(open?"open ":"")+(ov?"ov":"")}><div><div className="grid gap-5 px-5 pb-6 pt-1 sm:px-6 md:grid-cols-2 lg:grid-cols-3">

  <div><div className="mb-1.5 text-sm font-semibold">Avoid cities</div><${CityInput} multi label="Avoid cities" chips=${s.avoid} other=${s.must} onChips=${v=>set({avoid:v})} placeholder=${s.avoid.length?"":"e.g. Paris"}/></div>
  <div className="relative flex items-center self-center min-h-[52px] lg:col-start-3 lg:row-start-2"><label className="flex cursor-pointer items-center gap-3 text-[15px] font-semibold leading-snug"><input type="checkbox" checked=${s.flex} onChange=${e=>set({flex:e.target.checked})} className="h-5 w-5 shrink-0 accent-[#00A88D]"/>I'm flexible with travel dates</label>
   <button type="button" aria-label="Why flexible dates?" aria-expanded=${tip} onClick=${()=>setTip(!tip)} className="ml-2 shrink-0"><${Icon} n="info" c="h-[18px] w-[18px] stroke-mute"/></button>
   ${tip&&h`<div role="note" className="absolute bottom-full left-0 z-40 mb-1 w-64 rounded-xl border border-line bg-white p-3 text-xs text-mute shadow-lg">Flexible dates help Explorer discover potentially cheaper routes.</div>`}</div>
 </div></div></div></section>`};

/* ---------- search form + results ---------- */
const DEFAULT={from:"London",date:"2026-12-12",len:"5–8 days",custom:"6",trav:2,scope:"whole",budget:"550",modes:["flight","train"],cities:"Any number",ret:"",nights:"Flexible",must:[],avoid:[],flex:false};
const TripSearchForm=({s,set:setRaw,onSearch})=>{const[er,setEr]=useState({}),[note,setNote]=useState(""),today=new Date().toISOString().slice(0,10);
 const set=p=>{setNote("");
  if("date" in p&&s.ret){
   if(!p.date||p.date>=s.ret){setRaw({...p,ret:""});setNote("Return date cleared: it must be after your departure date. Pick a new one or use a trip-length range.");return}
   setRaw(p);setNote("Trip length updated to "+diff(s.ret,p.date)+" days to match your return date.");return}
  if(p.ret){setRaw(p);setNote("Trip length set to "+diff(p.ret,s.date)+" days from your dates.");return}
  if("ret" in p&&s.ret)setNote("Return date removed. Choose a trip-length range.");
  setRaw(p)};
 const submit=e=>{e.preventDefault();const x={};
  if(!s.from.trim())x.from=1;if(!s.date||s.date<today)x.date=1;if(!/^[1-9]\d*$/.test(s.budget))x.budget=1;if(!s.modes.length)x.modes=1;if(s.ret&&s.ret<=s.date)x.ret=1;
  setEr(x);if(!Object.keys(x).length)onSearch()};
 return h`<form onSubmit=${submit} noValidate className="space-y-4 pb-16" aria-label="Trip search">
 <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-[1.25fr_1fr_1fr_.9fr]">
  <${LocationInput} s=${s} set=${set} err=${er.from}/><${DatePicker} s=${s} set=${set} min=${today} err=${er.date}/><${TripDurationSelector} s=${s} set=${set}/><${TravellerSelector} s=${s} set=${set}/></div>
 ${(er.from||er.date||er.ret)&&h`<p role="alert" className="text-[13px] text-red-700">${er.from?"Enter where you’re leaving from.":er.date?"Choose a travel date in the future.":"Return date must be after your departure date."}</p>`}
 ${note&&h`<p role="status" className="text-[13px] font-semibold text-teal">${note}</p>`}
 <div className="grid gap-4 lg:grid-cols-2"><${BudgetSelector} s=${s} set=${set} err=${er.budget}/><${TransportSelector} s=${s} set=${set} err=${er.modes}/></div>
 <${AdvancedSearch} s=${s} set=${set}/>
 <button type="submit" className="flex h-16 w-full items-center justify-center gap-3 rounded-[18px] explorer-pop text-xl font-bold transition hover:shadow-lg">Find my trip <${Icon} n="arrow" c="h-5 w-5 stroke-white"/></button></form>`};

const POOL=["Amsterdam","Berlin","Prague","Vienna","Budapest","Brussels","Copenhagen","Krakow","Munich","Zurich","Lisbon","Porto","Rome","Milan","Barcelona","Paris"];
function mock(s){const n=s.cities==="Any number"?0:parseInt(s.cities)||3;
 return[0,1,2].map(i=>{const c=s.cities==="Any number"?2+i:n,base=POOL.filter(x=>x!==s.from&&!s.avoid.includes(x)&&!s.must.includes(x));
  const mid=[...s.must,...base.slice(i*3,i*3+9)].slice(0,Math.max(c,s.must.length));
  return{id:`demo-${i}-${s.from}`,title:["Classic loop","Off the beaten track","Longer circuit"][i],route:[s.from,...mid,s.from]}})}
/* ---------- editable journey details (illustrative route only) ---------- */
const JourneyDetails=({trip,s,onSave,saved,onRouteChange})=>{
 const [editing,setEditing]=useState(false),[draft,setDraft]=useState(trip.route.slice(1,-1));
 useEffect(()=>{setDraft(trip.route.slice(1,-1));setEditing(false)},[trip.id,trip.route.join("|")]);
 const home=trip.route[0];
 const change=(i,v)=>setDraft(old=>old.map((x,j)=>j===i?v:x));
 const move=(i,delta)=>setDraft(old=>{const a=[...old],j=i+delta;if(j<0||j>=a.length)return old;[a[i],a[j]]=[a[j],a[i]];return a});
 const valid=draft.length&&draft.every(x=>x.trim()&&x.trim().toLowerCase()!==home.trim().toLowerCase())&&new Set(draft.map(x=>x.toLowerCase().trim())).size===draft.length;
 return h`<section className=${CARD+" mt-5 p-5 sm:p-7"} aria-label="Journey details">
 <div className="flex flex-wrap items-start justify-between gap-3"><div><span className="text-xs font-extrabold uppercase tracking-wide text-teal">Journey overview</span><h2 className="mt-1 text-2xl font-extrabold">${trip.title}</h2><p className="mt-2 text-sm text-mute">${trip.route.join(" → ")}</p></div><button type="button" onClick=${()=>onSave(trip,s)} className="rounded-xl border border-teal/50 bg-sel px-4 py-2.5 text-sm font-bold">${saved?"Saved ✓":"Save journey"}</button></div>
 <div className="mt-5 rounded-2xl bg-bg p-4"><div className="text-sm font-bold">Estimated transport price</div><div className="mt-1 text-xl font-extrabold">Not available yet</div><p className="mt-1 text-xs text-mute">Prices, availability and providers require a travel-data integration. Your search budget: ${eur(s.budget)} (${s.scope==="whole"?"whole trip — work in progress":"transport only"}).</p></div>
 <div className="mt-6 flex flex-wrap items-center justify-between gap-3"><h3 className="text-lg font-extrabold">Your route</h3><button type="button" onClick=${()=>setEditing(v=>!v)} className="rounded-lg border border-forest px-4 py-2 text-sm font-bold text-forest hover:bg-mint">${editing?"Cancel editing":"Edit route"}</button></div>
 ${editing?h`<div className="mt-3 space-y-3 rounded-lg border border-teal/40 bg-sel p-4"><p className="text-xs text-mute">Change, reorder or remove stops. Your round trip will still begin and end in ${home}.</p>
 <div className="rounded-lg bg-white px-3 py-2 text-sm font-bold">Start: ${home}</div>
 ${draft.map((city,i)=>h`<div key=${i} className="flex flex-wrap items-center gap-2 rounded-lg border border-line bg-white p-2"><span className="w-7 text-center text-sm font-bold text-forest">${i+1}</span><input aria-label=${"Stop "+(i+1)} list="explorer-city-options" value=${city} onChange=${e=>change(i,e.target.value)} className="min-w-[110px] flex-1 border-b border-line px-2 py-2 text-sm outline-none focus:border-teal"/><button type="button" aria-label=${"Move stop "+(i+1)+" earlier"} disabled=${i===0} onClick=${()=>move(i,-1)} className="border border-line px-2 py-1 disabled:opacity-30">↑</button><button type="button" aria-label=${"Move stop "+(i+1)+" later"} disabled=${i===draft.length-1} onClick=${()=>move(i,1)} className="border border-line px-2 py-1 disabled:opacity-30">↓</button><button type="button" aria-label=${"Remove stop "+(i+1)} disabled=${draft.length<=1} onClick=${()=>setDraft(old=>old.filter((_,j)=>j!==i))} className="border border-line px-2 py-1 text-red-700 disabled:opacity-30">×</button></div>`)}
 <datalist id="explorer-city-options">${CITIES.map(c=>h`<option key=${c} value=${c}/>`)}<//>
 <div className="rounded-lg bg-white px-3 py-2 text-sm font-bold">Return: ${home}</div>
 <div className="flex flex-wrap gap-2"><button type="button" onClick=${()=>setDraft(old=>[...old,""])} className="rounded-lg border border-line bg-white px-3 py-2 text-sm font-semibold">+ Add stop</button><button type="button" disabled=${!valid} onClick=${()=>{onRouteChange(trip.id,[home,...draft.map(x=>x.trim()),home]);setEditing(false)}} className="rounded-lg bg-forest px-4 py-2 text-sm font-bold text-white disabled:opacity-40">Save route changes</button></div>
 ${!valid&&h`<p className="text-xs text-red-700">Keep at least one unique stop, different from your starting city.</p>`}<p className="text-xs text-mute">Editing changes only this sample itinerary. Prices and transport connections must be recalculated when live data is integrated.</p></div>`:h`<div className="mt-3 space-y-3">${trip.route.slice(1).map((dest,i)=>h`<div key=${i} className="flex items-center gap-3 rounded-xl border border-line p-3"><div className="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-mint text-sm font-extrabold text-forest">${i+1}</div><div className="min-w-0 flex-1"><div className="font-bold">${trip.route[i]} → ${dest}</div><p className="text-xs text-mute">Transport options: ${s.modes.join(", ")} · Segment details to be connected</p></div><span className="text-xs font-semibold text-mute">Price pending</span></div>`)}</div>`}
 <div className="mt-6 rounded-2xl border border-line p-4"><h3 className="font-extrabold">Book your journey</h3><p className="mt-1 text-sm text-mute">Each segment will link to its provider. Booking happens on the provider's website, with no Explorer redirect fee.</p><button type="button" disabled className="mt-3 cursor-not-allowed rounded-xl bg-line px-4 py-2.5 text-sm font-bold text-mute">Provider links coming soon</button></div>
 <div className="mt-5 rounded-2xl bg-mint/50 p-4"><h3 className="font-extrabold">While you're there</h3><p className="mt-1 text-sm text-mute">A few ideas for your stops will appear here later.</p></div>
 <p className="mt-4 text-xs text-mute">Illustrative route only; not checked for real connections, prices or feasibility.</p>
 </section>`;
};
const TripResults=({s,back,saved,toggle,onSaveSearch,searchSaved,onRouteChange})=>{const[detail,setDetail]=useState(null);const [overrides,setOverrides]=useState({});const trips=mock(s).map(t=>({...t,route:overrides[t.id]||saved.find(x=>x.id===t.id)?.route||t.route}));const selected=trips.find(t=>t.id===detail);
 const changeRoute=(id,route)=>{setOverrides(old=>({...old,[id]:route}));onRouteChange(id,route)};
 return h`<div className="pb-16"><div role="note" className="rounded-2xl border border-teal/40 bg-sel px-5 py-3 text-sm font-semibold">Demonstration results — sample routes only. No live transport prices, availability or booking links.</div>
 <div className="mt-4 flex flex-wrap items-center justify-between gap-3"><h1 className="text-3xl font-extrabold">Round trips from ${s.from}</h1><div className="flex flex-wrap gap-2"><button type="button" onClick=${()=>onSaveSearch(s)} className="rounded-full border border-teal/40 bg-white px-5 py-2.5 font-semibold hover:bg-mint">${searchSaved?"Search saved ✓":"Save search"}</button><button type="button" onClick=${back} className="rounded-full bg-mint px-5 py-2.5 font-semibold hover:bg-soft">Edit search</button></div></div>
 <p className="mt-1 text-mute">${fmtD(s.date)} · ${tripLen(s)}${s.ret?" (back "+fmtD(s.ret)+")":""} · ${s.trav} ${s.trav===1?"traveller":"travellers"} · up to ${eur(s.budget)} (${s.scope==="whole"?"whole trip":"transport only"}) · ${s.modes.join(", ")}</p>
 <div className="mt-5 grid gap-4 md:grid-cols-3">${trips.map(t=>{const on=saved.some(x=>x.id===t.id);return h`<article key=${t.id} className=${CARD+" explorer-card-accent flex flex-col p-5"}><span className="w-fit rounded-full bg-mint px-2.5 py-1 text-[11px] font-bold text-forest">Example route</span><h2 className="mt-3 text-lg font-bold">${t.title}</h2><p className="mt-2 flex-1 text-[15px] leading-relaxed text-mute">${t.route.join(" → ")}</p><p className="mt-3 text-xs text-mute">Returns to ${s.from}. Price unavailable until live data is connected.</p><div className="mt-4 grid grid-cols-2 gap-2"><button type="button" onClick=${()=>setDetail(t.id===detail?null:t.id)} aria-expanded=${detail===t.id} className="rounded-xl bg-forest px-3 py-2.5 text-sm font-semibold text-white hover:bg-deep">${detail===t.id?"Hide details":"View journey"}</button><button type="button" onClick=${()=>toggle(t,s)} aria-pressed=${on} className=${"rounded-xl border px-3 py-2.5 text-sm font-semibold "+(on?"border-teal/70 bg-sel":"border-line hover:bg-mint")}>${on?"Saved ✓":"Save"}</button></div></article>`})}</div>
 ${selected&&h`<${JourneyDetails} trip=${selected} s=${s} onSave=${toggle} saved=${saved.some(t=>t.id===selected.id)} onRouteChange=${changeRoute}/>`}
 </div>`};
const Page=({title,children})=>h`<div className=${CARD+" mb-16 max-w-2xl p-7"}><h1 className="text-3xl font-extrabold">${title}</h1><div className="mt-3 space-y-3 text-mute">${children}</div></div>`;

/* ---------- bottom account launcher: non-functional authentication preview ---------- */
const AccountLauncher=({go})=>{
 const [open,setOpen]=useState(false),[panel,setPanel]=useState(null),[login,setLogin]=useState("signup"),[updates,setUpdates]=useState(false);
 useEffect(()=>{const onKey=e=>{if(e.key==="Escape"){setPanel(null);setOpen(false)}};window.addEventListener("keydown",onKey);return()=>window.removeEventListener("keydown",onKey)},[]);
 const openPanel=p=>{setOpen(false);setPanel(p)};
 return h`<div><button type="button" className="account-fab" aria-label="Open account menu" aria-expanded=${open} onClick=${()=>{setOpen(v=>!v);setPanel(null)}}><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 21c.4-4 3.3-6 7.5-6s7.1 2 7.5 6"/></svg></button>
 ${open&&h`<div className="account-menu" role="menu" aria-label="Account"><div className="border-b border-line px-3 pb-3"><p className="font-bold text-forest">Explorer account</p><p className="text-xs text-mute">Guest mode · preview</p></div><button type="button" onClick=${()=>openPanel("auth")}>My account / Sign in</button><button type="button" onClick=${()=>{setOpen(false);go("trips")}}>My trips</button><button type="button" onClick=${()=>openPanel("plans")}>My plan & pricing</button><button type="button" onClick=${()=>openPanel("settings")}>Settings</button></div>`}
 ${panel&&h`<div className="account-backdrop" onClick=${()=>setPanel(null)}><div className="account-modal" role="dialog" aria-modal="true" aria-label=${panel==="auth"?"Sign up or log in":panel==="plans"?"Subscription plans":"Settings"} onClick=${e=>e.stopPropagation()}>
 <div className="mb-4 flex items-center justify-between">${panel==="auth"?h`<img src=${LOGO} alt="Explorer" className="h-12 w-auto max-w-[75%] object-contain"/>`:h`<h2 className="text-xl font-extrabold text-forest">${panel==="plans"?"Choose your plan":"Settings"}</h2>`}<button type="button" onClick=${()=>setPanel(null)} aria-label="Close dialog" className="p-2 text-xl">×</button></div>
 ${panel==="auth"?h`<div><div className="mb-4 flex gap-2"><button type="button" className=${"flex-1 border-b-2 py-2 font-bold "+(login==="signup"?"border-teal":"border-line")} onClick=${()=>setLogin("signup")}>Sign up</button><button type="button" className=${"flex-1 border-b-2 py-2 font-bold "+(login==="login"?"border-teal":"border-line")} onClick=${()=>setLogin("login")}>Log in</button></div><button type="button" disabled className="w-full rounded-lg border border-line px-3 py-3 font-semibold text-mute">Continue with Google — coming soon</button><p className="py-3 text-center text-xs text-mute">or continue with email</p>${login==="signup"&&h`<label className="block text-sm font-semibold">First name<input placeholder="Your first name"/></label>`}<label className="block text-sm font-semibold">Email address<input type="email" placeholder="you@example.com"/></label><label className="block text-sm font-semibold">Password<input type="password" placeholder="Password"/></label>${login==="signup"&&h`<div className="space-y-3 text-xs"><label className="flex gap-2"><input type="checkbox"/> I agree to the Terms of Service and Privacy Policy.</label><label className="flex gap-2"><input type="checkbox" checked=${updates} onChange=${e=>setUpdates(e.target.checked)}/> Send me Explorer news, new features and traveller stories (optional).</label></div>`}<button type="button" disabled className="mt-5 w-full rounded-lg bg-forest px-3 py-3 font-semibold text-white opacity-60">${login==="signup"?"Create free account":"Log in"} — coming soon</button><p className="mt-3 text-xs text-mute">Design preview — no account is created and no data is submitted.</p></div>`:panel==="plans"?h`<div className="space-y-3"><p className="text-sm text-mute">You are browsing as a guest. Plans below are proposed and payments are not active.</p>${[["Free","€0","Search and save up to 3 items"],["Plus","€2.99/month","More saved plans and planning options"],["Premium","€5.99/month","Advanced tools once available"]].map(([name,price,desc])=>h`<div className="rounded-lg border border-line p-3"><div className="flex justify-between gap-3 font-bold"><span>${name}</span><span>${price}</span></div><p className="mt-1 text-xs text-mute">${desc}</p></div>`)}</div>`:h`<div className="space-y-3"><p className="text-sm text-mute">Preferences will sync across devices after account functionality is connected.</p><div className="rounded-lg border border-line p-3 text-sm"><strong>Currency</strong><p className="text-mute">EUR (€) · current preview</p></div><label className="flex items-start gap-2 rounded-lg border border-line p-3 text-sm"><input type="checkbox" checked=${updates} onChange=${e=>setUpdates(e.target.checked)}/> Explorer updates (local preview; not subscribed)</label><p className="text-xs text-mute">Account deletion, login security and subscription billing will be available after backend integration.</p></div>`}
 </div></div>`}
 </div>`;
};
function App(){
 const[s,setS]=useState(()=>({...DEFAULT,...load("explorer.prefs",{})})),[view,setView]=useState("search"),[saved,setSaved]=useState(()=>load("explorer.trips",[])),[searches,setSearches]=useState(()=>load("explorer.searches",[]));
 const set=p=>setS(o=>{const n={...o,...p};save("explorer.prefs",n);return n});
 const go=v=>{setView(v);scrollTo(0,0)};
 const updateSavedRoute=(id,route)=>setSaved(o=>{const n=o.map(x=>x.id===id?{...x,route}:x);save("explorer.trips",n);return n});
 const toggle=(t,sr)=>setSaved(o=>{const n=o.some(x=>x.id===t.id)?o.filter(x=>x.id!==t.id):[...o,{...t,from:sr.from}];save("explorer.trips",n);return n});
 const searchKey=v=>JSON.stringify(v);
 const saveSearch=v=>setSearches(o=>{const key=searchKey(v),found=o.some(x=>x.key===key);const n=found?o.filter(x=>x.key!==key):[...o,{key,settings:{...v},title:"From "+v.from+" · "+fmtD(v.date)}];save("explorer.searches",n);return n});
 const rerunSearch=entry=>{setS(entry.settings);save("explorer.prefs",entry.settings);go("results")};
 return h`<div className="relative min-h-screen overflow-hidden"><div className="dots pointer-events-none absolute inset-x-0 top-0 h-[420px] opacity-60 [mask-image:linear-gradient(#000,transparent)]"/>
 <div className="pointer-events-none absolute -left-40 top-52 h-[380px] w-[380px] rounded-full bg-soft"/><div className="pointer-events-none absolute -right-48 -top-10 h-[460px] w-[460px] rounded-full bg-[#B7E6EE]/75"/>
 <div className="relative mx-auto max-w-[1180px] px-4 sm:px-6"><${Header} view=${view} go=${go}/>
 ${view==="search"&&h`<div className="mt-4"><${TripSearchForm} s=${s} set=${set} onSearch=${()=>go("results")}/></div>`}
 ${view==="results"&&h`<${TripResults} s=${s} back=${()=>go("search")} saved=${saved} toggle=${toggle} onSaveSearch=${saveSearch} searchSaved=${searches.some(x=>x.key===searchKey(s))} onRouteChange=${updateSavedRoute}/>`}
 ${view==="about"&&h`<${Page} title="About us"><p>Explorer helps students and budget-conscious travellers discover affordable multi-city round trips.</p><p>Explorer doesn’t sell tickets: journeys link out to external booking providers. This page is a placeholder.</p><//>`}
 ${view==="trips"&&h`<${Page} title="My trips"><h2 className="font-bold text-ink">Saved journeys</h2>${saved.length?saved.map(t=>h`<div key=${t.id} className="rounded-xl bg-bg p-3"><b className="text-ink">${t.title}</b><br/>${t.route.join(" → ")}<br/><span className="text-xs">Example route · not bookable</span></div>`):h`<p>No saved journeys yet.</p>`}<h2 className="pt-4 font-bold text-ink">Saved searches</h2>${searches.length?searches.map(q=>h`<div key=${q.key} className="flex flex-wrap items-center justify-between gap-3 rounded-xl bg-bg p-3"><span><b className="text-ink">${q.title}</b><br/><span className="text-xs">${eur(q.settings.budget)} · ${q.settings.modes.join(", ")}</span></span><button type="button" onClick=${()=>rerunSearch(q)} className="rounded-lg bg-mint px-3 py-2 text-sm font-bold text-forest">Run again</button></div>`):h`<p>No saved searches yet.</p>`}<p className="pt-3 text-xs">Demo saves are stored only in this browser, not in a registered account.</p><//>`}
 </div><${AccountLauncher} go=${go}/></div>`}
ReactDOM.createRoot(document.getElementById("root")).render(h`<${App}/>`);
</script>
</body></html>
