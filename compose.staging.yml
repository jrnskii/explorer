services:
  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    init: true
    environment:
      APP_ENV: staging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      APP_ACCESS_TOKEN: ${APP_ACCESS_TOKEN:?Set a random APP_ACCESS_TOKEN of at least 32 characters}
      SCRAPPA_API_KEY: ${SCRAPPA_API_KEY:?Set SCRAPPA_API_KEY for best-opportunity verification}
      SCRAPPA_CACHE_PATH: /cache/scrappa.duckdb
      SCHEDULE_SNAPSHOT_PATH: /data/schedules.sqlite
      SCHEDULE_MAX_AGE_SECONDS: ${SCHEDULE_MAX_AGE_SECONDS:-86400}
      REFERENCE_GRAPH_PATH: /data/base_graph.pickle
      FORECAST_MODELS_PATH: /data/forecast_models.json
    volumes:
      - type: bind
        source: ${STAGING_DATA_DIRECTORY:?Set STAGING_DATA_DIRECTORY to the directory containing schedules.sqlite}
        target: /data
        read_only: true
      - scrappa_cache:/cache
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 30s
    mem_limit: 2g
    cpus: 2
  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    init: true
    environment:
      APP_ACCESS_TOKEN: ${APP_ACCESS_TOKEN:?Set APP_ACCESS_TOKEN}
      BACKEND_GRAPHQL_URL: http://backend:8000/graphql
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 6s
      retries: 3
    mem_limit: 1g
    cpus: 2

volumes:
  scrappa_cache:
