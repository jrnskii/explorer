[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.162.5",
    "networkx>=3.7",
    "pydantic>=2.14.3",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "datamodel-code-generator[black,graphql,isort]>=0.95.0",
]
