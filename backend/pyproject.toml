[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cosmograph>=0.5.3",
    "dotenv>=0.9.9",
    "duckdb>=2.0.0",
    "fastapi>=0.162.5",
    "huggingface-hub>=2.4.0",
    "kaggle>=2.2.5",
    "networkx>=3.7",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "six>=1.17.0",
]

[project.scripts]
backend = "backend.presentation.cli.backend:main"
mock-ignav = "backend.presentation.cli.mock_ignav:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "datamodel-code-generator[black,graphql,isort]>=0.95.0",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "netwulf>=0.1.5",
    "setuptools>=80.9.0",
    "voila>=0.5.11",
]
